name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the manifest version
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest version ${version}" >&2
            exit 1
          fi

      - name: Check main.js parses
        run: node --check main.js

      - name: Make the install zip
        run: |
          mkdir ecliptic
          cp main.js manifest.json styles.css ecliptic/
          zip -r "ecliptic-${GITHUB_REF_NAME}.zip" ecliptic

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title="${GITHUB_REF_NAME}" \
            --notes="See CHANGELOG.md." \
            main.js manifest.json styles.css "ecliptic-${GITHUB_REF_NAME}.zip"
